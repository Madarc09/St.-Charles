<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" width="760" height="170">
  <defs>
    <filter id="chalk" x="-12%" y="-45%" width="124%" height="190%">
      <feTurbulence type="fractalNoise" baseFrequency="0.071" numOctaves="4" seed="114" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="0.2"/>
    </filter>
    <style><![CDATA[
      .goth{font-family:Georgia,'Times New Roman',serif;font-size:86px;font-weight:900;letter-spacing:8px;fill:#f2f0df;opacity:.21;filter:url(#chalk)}
      .edge{font-family:Georgia,'Times New Roman',serif;font-size:86px;font-weight:900;letter-spacing:8px;fill:none;stroke:#f8f4df;stroke-width:3.8;stroke-linejoin:round;stroke-linecap:round;filter:url(#chalk)}
      .shade{font-family:Georgia,'Times New Roman',serif;font-size:86px;font-weight:900;letter-spacing:8px;fill:none;stroke:#171714;stroke-width:7;stroke-linejoin:round;opacity:.42}
      .line{fill:none;stroke:#f4f1df;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;opacity:.76;filter:url(#chalk)}
      .thin{fill:none;stroke:#f4f1df;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;opacity:.60;filter:url(#chalk)}
      .dust{fill:#f4f1df;opacity:.34;filter:url(#chalk)}
    ]]></style>
  </defs>
  <g transform="translate(0 2)">
    <path class="thin" d="M79 73 q43 -30 86 0 q-43 30 -86 0Z M595 73 q43 -30 86 0 q-43 30 -86 0Z"/>
    <path class="line" d="M168 125 C260 151, 499 151, 592 125"/>
    <path class="thin" d="M226 134 L294 101 M535 134 L467 101 M255 141 l-33 12 M505 141 l33 12"/>
    <text class="shade" x="380" y="96" text-anchor="middle">ROSTERS</text>
    <text class="goth" x="380" y="96" text-anchor="middle">ROSTERS</text>
    <text class="edge" x="380" y="96" text-anchor="middle">ROSTERS</text>
    <circle class="dust" cx="96" cy="36" r="4"/><circle class="dust" cx="663" cy="37" r="4"/><circle class="dust" cx="381" cy="139" r="3"/>
  </g>
</svg>
