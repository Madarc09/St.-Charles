<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" width="760" height="170">
  <defs>
    <filter id="chalk" x="-14%" y="-55%" width="128%" height="210%">
      <feTurbulence type="fractalNoise" baseFrequency="0.057" numOctaves="5" seed="193" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.85" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="0.16"/>
    </filter>
    <filter id="dust" x="-20%" y="-70%" width="140%" height="240%">
      <feTurbulence type="fractalNoise" baseFrequency="0.12" numOctaves="3" seed="42"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .32"/></feComponentTransfer>
    </filter>
    <style><![CDATA[
      .script{font-family:'Brush Script MT','Snell Roundhand','Segoe Script','Lucida Handwriting',cursive;font-size:96px;font-weight:400;letter-spacing:1px;fill:none;stroke:#f4f0dc;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round;filter:url(#chalk);opacity:.88}
      .soft{font-family:'Brush Script MT','Snell Roundhand','Segoe Script','Lucida Handwriting',cursive;font-size:96px;font-weight:400;letter-spacing:1px;fill:#f4f0dc;opacity:.12;filter:url(#chalk)}
      .shadow{font-family:'Brush Script MT','Snell Roundhand','Segoe Script','Lucida Handwriting',cursive;font-size:96px;font-weight:400;letter-spacing:1px;fill:none;stroke:#11110f;stroke-width:4.8;stroke-linejoin:round;stroke-linecap:round;opacity:.38}
      .line{fill:none;stroke:#f4f0dc;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;opacity:.65;filter:url(#chalk)}
      .thin{fill:none;stroke:#f4f0dc;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round;opacity:.48;filter:url(#chalk)}
      .speck{fill:#f4f0dc;opacity:.28;filter:url(#dust)}
    ]]></style>
  </defs>
  <g transform="translate(0 4)">
    <path class="thin" d="M102 74 q36 -23 72 0 q-36 24 -72 0Z M586 74 q36 -23 72 0 q-36 24 -72 0Z"/>
    <path class="line" d="M210 126 C292 146 468 146 550 126"/>
    <path class="thin" d="M237 132 l-35 13 M523 132 l35 13"/>
    <text class="shadow" x="380" y="98" text-anchor="middle">Rosters</text>
    <text class="soft" x="380" y="98" text-anchor="middle">Rosters</text>
    <text class="script" x="380" y="98" text-anchor="middle">Rosters</text>
    <circle class="speck" cx="105" cy="38" r="3"/><circle class="speck" cx="657" cy="39" r="3"/><circle class="speck" cx="382" cy="139" r="2.2"/>
  </g>
</svg>
