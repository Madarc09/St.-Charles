<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" width="760" height="170">
  <defs>
    <filter id="chalk" x="-12%" y="-45%" width="124%" height="190%">
      <feTurbulence type="fractalNoise" baseFrequency="0.065" numOctaves="4" seed="91" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="0.18"/>
    </filter>
    <style><![CDATA[
      .goth{font-family:Georgia,'Times New Roman',serif;font-size:76px;font-weight:900;letter-spacing:5px;fill:#f2f0df;opacity:.22;filter:url(#chalk)}
      .edge{font-family:Georgia,'Times New Roman',serif;font-size:76px;font-weight:900;letter-spacing:5px;fill:none;stroke:#f7f4e2;stroke-width:3.6;stroke-linejoin:round;stroke-linecap:round;filter:url(#chalk)}
      .shade{font-family:Georgia,'Times New Roman',serif;font-size:76px;font-weight:900;letter-spacing:5px;fill:none;stroke:#1b1b18;stroke-width:7;stroke-linejoin:round;opacity:.45}
      .line{fill:none;stroke:#f4f1df;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;opacity:.78;filter:url(#chalk)}
      .thin{fill:none;stroke:#f4f1df;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;opacity:.62;filter:url(#chalk)}
      .dust{fill:#f4f1df;opacity:.35;filter:url(#chalk)}
    ]]></style>
  </defs>
  <g transform="translate(0 4)">
    <path class="thin" d="M52 104 C98 82, 123 82, 171 104 M588 104 C636 82, 661 82, 708 104"/>
    <path class="line" d="M124 124 C228 152, 532 152, 637 124"/>
    <path class="thin" d="M174 132 L238 101 M586 132 L522 101 M211 139 l-34 12 M549 139 l34 12"/>
    <text class="shade" x="380" y="92" text-anchor="middle">STANDINGS</text>
    <text class="goth" x="380" y="92" text-anchor="middle">STANDINGS</text>
    <text class="edge" x="380" y="92" text-anchor="middle">STANDINGS</text>
    <path class="thin" d="M362 113 q18 15 36 0 q-18 -10 -36 0Z"/>
    <circle class="dust" cx="73" cy="45" r="4"/><circle class="dust" cx="688" cy="47" r="4"/><circle class="dust" cx="380" cy="138" r="3"/>
  </g>
</svg>
