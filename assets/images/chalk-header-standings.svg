<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" width="760" height="170">
  <defs>
    <filter id="chalk" x="-14%" y="-55%" width="128%" height="210%">
      <feTurbulence type="fractalNoise" baseFrequency="0.052" numOctaves="5" seed="192" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.9" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="0.16"/>
    </filter>
    <filter id="dust" x="-20%" y="-70%" width="140%" height="240%">
      <feTurbulence type="fractalNoise" baseFrequency="0.12" numOctaves="3" seed="41"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .32"/></feComponentTransfer>
    </filter>
    <style><![CDATA[
      .script{font-family:'Brush Script MT','Snell Roundhand','Segoe Script','Lucida Handwriting',cursive;font-size:88px;font-weight:400;letter-spacing:.5px;fill:none;stroke:#f4f0dc;stroke-width:2.3;stroke-linejoin:round;stroke-linecap:round;filter:url(#chalk);opacity:.88}
      .soft{font-family:'Brush Script MT','Snell Roundhand','Segoe Script','Lucida Handwriting',cursive;font-size:88px;font-weight:400;letter-spacing:.5px;fill:#f4f0dc;opacity:.12;filter:url(#chalk)}
      .shadow{font-family:'Brush Script MT','Snell Roundhand','Segoe Script','Lucida Handwriting',cursive;font-size:88px;font-weight:400;letter-spacing:.5px;fill:none;stroke:#11110f;stroke-width:4.8;stroke-linejoin:round;stroke-linecap:round;opacity:.38}
      .line{fill:none;stroke:#f4f0dc;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;opacity:.67;filter:url(#chalk)}
      .thin{fill:none;stroke:#f4f0dc;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;opacity:.50;filter:url(#chalk)}
      .speck{fill:#f4f0dc;opacity:.28;filter:url(#dust)}
    ]]></style>
  </defs>
  <g transform="translate(0 6)">
    <path class="thin" d="M75 112 C143 88 195 91 251 112 M510 112 C565 91 617 88 685 112"/>
    <path class="line" d="M184 125 C272 145 488 145 577 125"/>
    <path class="thin" d="M214 130 l-38 15 M546 130 l38 15 M356 123 q24 19 48 0 q-24 -12 -48 0Z"/>
    <text class="shadow" x="380" y="94" text-anchor="middle">Standings</text>
    <text class="soft" x="380" y="94" text-anchor="middle">Standings</text>
    <text class="script" x="380" y="94" text-anchor="middle">Standings</text>
    <circle class="speck" cx="88" cy="47" r="3.1"/><circle class="speck" cx="672" cy="48" r="3.1"/><circle class="speck" cx="381" cy="139" r="2.2"/>
  </g>
</svg>
