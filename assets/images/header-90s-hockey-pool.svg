<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
<title id="title">Hockey Pool late 90s basement header</title>
<desc id="desc">A detailed late 1990s hockey basement with wood panel walls, CRT television, retro game console, hockey pool books, player cards, sticks, pucks, and the words Hockey Pool built into the scene.</desc>
<defs>
  <linearGradient id="wall" x1="0" x2="1"><stop stop-color="#251309"/><stop offset=".5" stop-color="#3a2112"/><stop offset="1" stop-color="#1b0d06"/></linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#24150c"/><stop offset="1" stop-color="#080a0c"/></linearGradient>
  <radialGradient id="tvGlow" cx="50%" cy="45%" r="60%"><stop stop-color="#b7f6ff" stop-opacity=".9"/><stop offset=".45" stop-color="#2bc8e8" stop-opacity=".45"/><stop offset="1" stop-color="#031017" stop-opacity="0"/></radialGradient>
  <linearGradient id="chrome" x1="0" x2="1"><stop stop-color="#e6edf0"/><stop offset=".25" stop-color="#71808a"/><stop offset=".55" stop-color="#f8ffff"/><stop offset="1" stop-color="#4b5c66"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".55"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
  <pattern id="panel" width="90" height="520" patternUnits="userSpaceOnUse"><rect width="90" height="520" fill="url(#wall)"/><path d="M0 0V520M88 0V520" stroke="#6b3d20" stroke-opacity=".35" stroke-width="3"/><path d="M14 0c12 80-6 130 7 220 12 82-9 150 12 300M60 0c-9 70 8 115-5 188-13 73 13 140-7 332" fill="none" stroke="#110803" stroke-opacity=".35" stroke-width="2"/></pattern>
  <pattern id="static" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#0a2230"/><path d="M0 1H8M0 5H8" stroke="#b8f8ff" stroke-opacity=".13"/><path d="M1 0V8M6 0V8" stroke="#fff" stroke-opacity=".07"/></pattern>
</defs>
<rect width="1600" height="520" fill="#07090b"/>
<rect width="1600" height="335" fill="url(#panel)"/>
<rect y="335" width="1600" height="185" fill="url(#floor)"/>
<ellipse cx="800" cy="360" rx="720" ry="200" fill="#000" opacity=".45"/>
<circle cx="780" cy="205" r="350" fill="url(#tvGlow)" opacity=".55" filter="url(#soft)"/>

<!-- string lights -->
<path d="M70 70 C280 20 460 100 650 55 S1030 45 1210 82 1420 28 1530 72" fill="none" stroke="#111" stroke-width="5" opacity=".75"/>
<g opacity=".95">
  <circle cx="135" cy="60" r="10" fill="#f94144"/><circle cx="250" cy="50" r="10" fill="#43e97b"/><circle cx="372" cy="70" r="10" fill="#4cc9f0"/><circle cx="510" cy="75" r="10" fill="#f9c74f"/>
  <circle cx="692" cy="56" r="10" fill="#f94144"/><circle cx="860" cy="48" r="10" fill="#43e97b"/><circle cx="1018" cy="55" r="10" fill="#4cc9f0"/><circle cx="1198" cy="81" r="10" fill="#f9c74f"/>
  <circle cx="1355" cy="58" r="10" fill="#f94144"/><circle cx="1488" cy="62" r="10" fill="#43e97b"/>
</g>

<!-- central poster / sign -->
<g filter="url(#shadow)">
  <path d="M420 78 L1180 78 Q1210 78 1210 108 L1210 260 Q1210 290 1180 290 L420 290 Q390 290 390 260 L390 108 Q390 78 420 78Z" fill="#091017" stroke="url(#chrome)" stroke-width="8"/>
  <rect x="415" y="102" width="770" height="164" rx="18" fill="url(#static)" stroke="#0df" stroke-opacity=".35" stroke-width="3"/>
  <path d="M435 124H1165M435 245H1165" stroke="#fff" stroke-opacity=".12"/>
  <text x="800" y="205" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="100" letter-spacing="6" fill="#f6c343" stroke="#111" stroke-width="7" paint-order="stroke">HOCKEY POOL</text>
  <text x="800" y="246" text-anchor="middle" font-family="Verdana, sans-serif" font-size="24" letter-spacing="5" fill="#bff7ff">DRAFT BOOKS • CARDS • 16-BIT CHAOS</text>
</g>

<!-- CRT TV -->
<g transform="translate(645 236)" filter="url(#shadow)">
  <rect x="0" y="0" width="310" height="205" rx="28" fill="#20272b" stroke="#69777e" stroke-width="6"/>
  <rect x="24" y="24" width="205" height="138" rx="18" fill="#071b23" stroke="#0b0f12" stroke-width="10"/>
  <rect x="34" y="34" width="185" height="118" rx="12" fill="#11364b"/>
  <path d="M45 102h160" stroke="#d7ffff" stroke-width="4" opacity=".6"/><path d="M126 45v102" stroke="#ff515e" stroke-width="3" opacity=".7"/>
  <rect x="65" y="70" width="28" height="22" fill="#f6c343"/><rect x="98" y="72" width="28" height="20" fill="#eff8fb"/><rect x="145" y="90" width="28" height="22" fill="#37d67a"/>
  <circle cx="120" cy="111" r="8" fill="#0b0"/><circle cx="174" cy="116" r="8" fill="#f33"/>
  <text x="126" y="141" text-anchor="middle" font-family="Verdana" font-size="12" fill="#d7ffff">RETRO HOCKEY '99</text>
  <circle cx="262" cy="55" r="20" fill="#05080a" stroke="#75848d" stroke-width="3"/><circle cx="262" cy="110" r="20" fill="#05080a" stroke="#75848d" stroke-width="3"/>
  <rect x="246" y="150" width="34" height="12" rx="5" fill="#0a0d0f"/><rect x="252" y="169" width="22" height="7" rx="3" fill="#0a0d0f"/>
  <path d="M85 205l-30 42M225 205l30 42" stroke="#191f22" stroke-width="11" stroke-linecap="round"/>
</g>

<!-- console and controllers -->
<g transform="translate(550 420)" filter="url(#shadow)">
  <rect x="0" y="0" width="220" height="55" rx="12" fill="#b8b3a8" stroke="#5a5a58" stroke-width="4"/>
  <rect x="30" y="12" width="80" height="20" rx="4" fill="#4b4b4b"/><rect x="125" y="10" width="65" height="30" rx="5" fill="#822"/>
  <text x="110" y="50" text-anchor="middle" font-family="Verdana" font-size="12" fill="#333">8-BIT ICEBOX</text>
  <path d="M50 55 C20 80 5 86 -30 82" fill="none" stroke="#111" stroke-width="5"/>
  <path d="M170 55 C220 80 245 88 280 78" fill="none" stroke="#111" stroke-width="5"/>
  <rect x="-92" y="65" width="72" height="32" rx="12" fill="#24262a" stroke="#5d646c" stroke-width="3"/><circle cx="-72" cy="81" r="7" fill="#111"/><circle cx="-42" cy="80" r="6" fill="#c33"/>
  <rect x="278" y="60" width="76" height="35" rx="13" fill="#24262a" stroke="#5d646c" stroke-width="3"/><circle cx="303" cy="78" r="7" fill="#111"/><circle cx="333" cy="77" r="6" fill="#3ca"/>
</g>

<!-- pool books and draft sheets left -->
<g transform="translate(75 268)" filter="url(#shadow)">
  <rect x="0" y="60" width="270" height="160" rx="10" fill="#091018" stroke="#3a4f5e" stroke-width="4"/>
  <rect x="22" y="0" width="155" height="210" rx="12" fill="#f0e4bd" stroke="#473520" stroke-width="4" transform="rotate(-7 22 0)"/>
  <text x="92" y="38" transform="rotate(-7 22 0)" text-anchor="middle" font-family="Arial Black" font-size="18" fill="#112">POOL BOOK</text>
  <text x="92" y="64" transform="rotate(-7 22 0)" text-anchor="middle" font-family="Verdana" font-size="12" fill="#112">1998-99</text>
  <g transform="rotate(-7 22 0)">
    <path d="M35 88H158M35 112H158M35 136H158M35 160H158" stroke="#5d4630" stroke-width="2" opacity=".55"/>
    <text x="42" y="103" font-family="Verdana" font-size="11" fill="#222">1. ____</text><text x="42" y="127" font-family="Verdana" font-size="11" fill="#222">2. ____</text><text x="42" y="151" font-family="Verdana" font-size="11" fill="#222">3. ____</text>
  </g>
  <rect x="155" y="24" width="95" height="135" rx="8" fill="#12385b" stroke="#dfe8ef" stroke-width="4" transform="rotate(9 155 24)"/>
  <text x="203" y="67" transform="rotate(9 155 24)" text-anchor="middle" font-family="Arial Black" font-size="16" fill="#fff">STATS</text>
  <text x="203" y="90" transform="rotate(9 155 24)" text-anchor="middle" font-family="Verdana" font-size="11" fill="#ffd166">GOALS</text>
  <text x="203" y="110" transform="rotate(9 155 24)" text-anchor="middle" font-family="Verdana" font-size="11" fill="#ffd166">ASSISTS</text>
</g>

<!-- hockey cards right -->
<g transform="translate(1225 250)" filter="url(#shadow)">
  <rect x="0" y="60" width="250" height="155" rx="14" fill="#090f13" stroke="#394a55" stroke-width="4"/>
  <g transform="rotate(-11 50 70)"><rect x="25" y="10" width="96" height="138" rx="9" fill="#e6eef4" stroke="#b51b2b" stroke-width="7"/><rect x="39" y="28" width="68" height="62" fill="#142c44"/><path d="M45 72h55" stroke="#fff" stroke-width="4"/><circle cx="73" cy="57" r="12" fill="#f6c343"/><text x="73" y="119" text-anchor="middle" font-family="Arial Black" font-size="13" fill="#111">ROOKIE</text></g>
  <g transform="rotate(8 120 38)"><rect x="100" y="20" width="96" height="138" rx="9" fill="#fff3cf" stroke="#1a6ad8" stroke-width="7"/><rect x="115" y="38" width="65" height="58" fill="#173d29"/><path d="M122 78h48" stroke="#fff" stroke-width="4"/><circle cx="148" cy="62" r="12" fill="#ff4d5d"/><text x="148" y="125" text-anchor="middle" font-family="Arial Black" font-size="13" fill="#111">ALL STAR</text></g>
  <g transform="rotate(-3 180 42)"><rect x="165" y="45" width="96" height="138" rx="9" fill="#dfe7ea" stroke="#f6c343" stroke-width="7"/><rect x="180" y="63" width="65" height="58" fill="#33214a"/><path d="M187 100h48" stroke="#fff" stroke-width="4"/><circle cx="212" cy="86" r="12" fill="#4cc9f0"/><text x="212" y="150" text-anchor="middle" font-family="Arial Black" font-size="12" fill="#111">SNIPER</text></g>
</g>

<!-- sticks, puck, tapes -->
<g opacity=".95">
  <path d="M1020 475 L1285 315" stroke="#c9924b" stroke-width="15" stroke-linecap="round"/><path d="M1277 314 q44-7 61 18" fill="none" stroke="#c9924b" stroke-width="17" stroke-linecap="round"/>
  <path d="M362 477 L640 315" stroke="#8d6338" stroke-width="14" stroke-linecap="round"/><path d="M350 474 q-40 6-60-14" fill="none" stroke="#8d6338" stroke-width="17" stroke-linecap="round"/>
  <ellipse cx="1030" cy="455" rx="42" ry="16" fill="#020405" stroke="#364148" stroke-width="5"/>
  <rect x="1120" y="390" width="55" height="40" rx="8" fill="#f4f0e4" stroke="#333" stroke-width="3"/><path d="M1126 404h43M1126 416h43" stroke="#d22" stroke-width="4"/>
  <rect x="420" y="385" width="70" height="48" rx="8" fill="#10161b" stroke="#4c5962" stroke-width="3"/><text x="455" y="415" text-anchor="middle" font-family="Verdana" font-size="12" fill="#bff7ff">VHS</text>
</g>

<!-- scanlines and vignette -->
<rect width="1600" height="520" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="2"/>
<path d="M0 0H1600V520H0Z" fill="url(#static)" opacity=".09"/>
<rect width="1600" height="520" fill="none"/>
<radialGradient id="v" cx="50%" cy="50%" r="75%"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".65"/></radialGradient>
<rect width="1600" height="520" fill="url(#v)"/>
</svg>